name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKER_IMAGE: olivergw/wordpress-custom

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract WordPress image tags
        id: wp_version
        run: |
          WP_TAG=$(awk '$1 == "FROM" && $2 ~ /^wordpress:/ { sub(/^wordpress:/, "", $2); print $2; exit }' Dockerfile)
          WP_VERSION="${WP_TAG%%-*}"
          PHP_SAPI="${WP_TAG#*-}"
          echo "tag=${WP_TAG}" >> "$GITHUB_OUTPUT"
          echo "wp_minor=${WP_VERSION%.*}" >> "$GITHUB_OUTPUT"
          echo "wp_major=${WP_VERSION%%.*}" >> "$GITHUB_OUTPUT"
          echo "php_sapi=${PHP_SAPI}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=${{ steps.wp_version.outputs.tag }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.wp_version.outputs.php_sapi }},enable={{is_default_branch}}
            type=raw,value=${{ steps.wp_version.outputs.wp_major }}-${{ steps.wp_version.outputs.php_sapi }},enable={{is_default_branch}}
            type=raw,value=${{ steps.wp_version.outputs.wp_minor }}-${{ steps.wp_version.outputs.php_sapi }},enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
