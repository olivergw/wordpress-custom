name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/wordpress-custom

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract WordPress version
        id: wp_version
        run: |
          WP_TAG=$(grep -oP 'FROM wordpress:\K[^\s]+' Dockerfile)
          echo "tag=${WP_TAG}" >> $GITHUB_OUTPUT
          PHP_VERSION=$(echo "${WP_TAG}" | grep -oP 'php\K[\d.]+')
          echo "php_version=${PHP_VERSION}" >> $GITHUB_OUTPUT
          echo "php_minor=${PHP_VERSION%.*}" >> $GITHUB_OUTPUT
          echo "php_major=${PHP_VERSION%%.*}" >> $GITHUB_OUTPUT
          VARIANT=$(echo "${WP_TAG}" | grep -oP '(?<=php[\d.]{3,}-).*' || true)
          if [ -n "${VARIANT}" ]; then
            echo "php_version_variant=php${PHP_VERSION}-${VARIANT}" >> $GITHUB_OUTPUT
            echo "php_minor_variant=php${PHP_VERSION%.*}-${VARIANT}" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.wp_version.outputs.tag }}
            type=raw,value=${{ steps.wp_version.outputs.php_version_variant }}
            type=raw,value=${{ steps.wp_version.outputs.php_minor_variant }}
            type=raw,value=${{ steps.wp_version.outputs.php_version }}
            type=raw,value=${{ steps.wp_version.outputs.php_minor }}
            type=raw,value=${{ steps.wp_version.outputs.php_major }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max